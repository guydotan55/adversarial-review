<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
<title id="t">adversarial-review</title><desc id="d">A Claude Code skill that reviews an artifact assuming it is broken, ranks findings by severity and stamps a verdict: NOT READY.</desc>
<rect width="1280" height="400" fill="#0D1117"/>
<rect x="0.5" y="0.5" width="1279" height="399" fill="none" stroke="#30363D"/>
<text x="80" y="165" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="60" font-weight="700" fill="#E6EDF3">adversarial-review</text>
<text x="80" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#9198A1">Assumes it is broken until proven otherwise.</text>
<text x="80" y="256" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#9198A1">Findings by severity, then a binary verdict.</text>
<text x="80" y="330" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#9198A1">A Claude Code skill</text>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect x="700" y="60" width="510" height="280" rx="14" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
<text x="730" y="102" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#9198A1">review-spec.md</text>
<line x1="730" y1="118" x2="1180" y2="118" stroke="#30363D"/>
<rect x="730" y="140" width="84" height="26" rx="6" fill="#CF222E"/>
<text x="772" y="158" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">BLOCKER</text>
<text x="830" y="159" font-size="16" fill="#E6EDF3">column used but never created</text>
<rect x="730" y="180" width="84" height="26" rx="6" fill="#BC4C00"/>
<text x="772" y="198" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">MAJOR</text>
<text x="830" y="199" font-size="16" fill="#E6EDF3">no failure path when send errors</text>
<rect x="730" y="220" width="84" height="26" rx="6" fill="#9198A1"/>
<text x="772" y="238" text-anchor="middle" font-size="14" font-weight="700" fill="#0D1117">MINOR</text>
<text x="830" y="239" font-size="16" fill="#E6EDF3">success metric has no baseline</text>
<g transform="rotate(-6 1050 295)">
